; FFRS QoL (MogHub page): zh-Hant

plugin.name = FFRS QoL 便利功能
plugin.description = 遇敵控制、戰鬥獎勵倍率、戰鬥速度、自動重複指令等。與 FFRS QoL 設定視窗是同一套設定，兩邊修改都會立即生效。在這裡關閉此外掛不會關閉 FFRS QoL 本身；要停用請刪除它的資料夾。

header.Field = 地圖
EncountersEnabled.label = 隨機遇敵
EncountersEnabled.help = 關閉後走路不會遇敵；劇情戰、固定戰鬥照常發生。快捷鍵：F6（可在設定視窗裡修改）。
EncounterRate.label = 遇敵頻率
EncounterRate.help = 隨機遇敵的頻率：2 = 加倍，0.5 = 減半。
MapMarkers.label = 寶箱、道具地圖標記
MapMarkers.help = 在地圖和小地圖上顯示還沒拿的寶箱和道具。

header.Battle rewards = 戰鬥獎勵
ExpMultiplier.label = 經驗
ExpMultiplier.help = 戰鬥獲得的經驗值。自動結算類 mod 結算的遇敵也會按此倍率補正。
MoneyMultiplier.label = 金錢 (Gil)
MoneyMultiplier.help = 戰鬥獲得的 Gil。自動結算類 mod 結算的遇敵也會按此倍率補正。
MRPointMultiplier.label = MR 點
MRPointMultiplier.help = 裝備的幻影（Vision）獲得的熟練度點數。
APMultiplier.label = AP
APMultiplier.help = 戰鬥獲得的 AP。
DropMultiplier.label = 物品掉落
DropMultiplier.help = 掉落機率 × 倍率，最高 100%。
RareAlwaysDrop.label = 稀有物品必掉
RareAlwaysDrop.help = 帶稀有掉落的敵人一定會掉落稀有物品。

header.Battle = 戰鬥
BattleSpeedMultiplier.label = 戰鬥速度
BattleSpeedMultiplier.help = 疊加遊戲內建的 1 / 1.5 / 2 倍速按鈕。
AlwaysEscape.label = 逃跑必定成功
AlwaysEscape.help = 只對允許逃跑的戰鬥生效；Boss 戰、劇情戰不受影響。
LBGainMultiplier.label = LB 充能
LBGainMultiplier.help = 極限爆發（LB）槽的充能速度。
PersistentLB.label = LB 槽跨戰鬥保留
PersistentLB.help = 每個角色的 LB 槽會保留到下一場戰鬥。
LibraScanAll.label = Libra 掃描全體敵人
LibraScanAll.help = Libra、Mechamog Scan（以及使用它們的道具）一次掃描所有敵人，圖鑑和弱點照常記錄。只改記憶體裡的技能表。
AutoLibra.label = 自動 Libra
AutoLibra.help = 戰鬥開始時自動掃描所有敵人，包括弱點，第一次遇到的敵人也一樣。和真正的 Libra 一樣會記入圖鑑，存檔後即使關掉也會保留。

header.Repeat last command = 重複上次指令
AutoRepeat.label = 自動重複
AutoRepeat.help = 簡易自動戰鬥：每個角色沿用上次的指令，沒有記錄的角色需手動選擇。快捷鍵：F8。
SmartSupport.label = 輔助技能智慧選目標
SmartSupport.help = 重複指令時，回復給 HP 最低的隊友，增益給還沒有該效果的隊友。

header.Items and abilities = 物品與能力
ItemLimit.label = 持有上限
ItemLimit.help = 每種物品最多持有數量。原版為 99；設回 99 即恢復。
APCapacityBonus.label = 能力 AP 上限 +
APCapacityBonus.help = 提高所有角色裝備能力的 AP 上限。讀取存檔後顯示。
AbilitySlots.label = 能力欄格數
AbilitySlots.help = 每個角色的能力欄格數（原版 8）。讀取存檔後生效。格子多了需要更多 AP，可以配合 AP 上限加成。調低時，已經裝在多出格子裡的能力會保留。

header.Settings window = 設定視窗
Open the settings window.label = 開啟設定視窗
Open the settings window.button = 開啟
Open the settings window.help = 完整的設定視窗（僅 Windows）：鍵盤和手把快捷鍵、倍率循環檔位、新增物品。
AutoOpenSettings.label = 啟動遊戲時開啟設定視窗
AutoOpenSettings.help = 每次啟動遊戲時自動開啟設定視窗。
UILanguage.label = 視窗語言
UILanguage.help = 設定視窗和 FFRS QoL 遊戲內提示的語言。
UILanguage.choice.auto = 自動
UILanguage.choice.zh = 中文
UILanguage.choice.en = English

windowOpened = 設定視窗已開啟（用 Alt+Tab 切過去）
