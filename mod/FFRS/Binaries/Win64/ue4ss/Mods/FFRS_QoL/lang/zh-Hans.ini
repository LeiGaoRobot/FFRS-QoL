; FFRS QoL (MogHub page): zh-Hans

plugin.name = FFRS QoL 便利功能
plugin.description = 遇敌控制、战斗奖励倍率、战斗速度、自动重复指令等。与 FFRS QoL 设置窗口是同一套设置，两边修改都会立即生效。在这里关闭此插件不会关闭 FFRS QoL 本身；要停用请删除它的文件夹。

header.Field = 地图
EncountersEnabled.label = 随机遇敌
EncountersEnabled.help = 关闭后走路不会遇敌；剧情战、固定战斗照常发生。快捷键：F6（可在设置窗口里修改）。
EncounterRate.label = 遇敌频率
EncounterRate.help = 随机遇敌的频率：2 = 翻倍，0.5 = 减半。
MapMarkers.label = 宝箱、道具地图标记
MapMarkers.help = 在地图和小地图上显示还没拿的宝箱和道具。

header.Battle rewards = 战斗奖励
ExpMultiplier.label = 经验
ExpMultiplier.help = 战斗获得的经验值。自动结算类 mod 结算的遇敌也会按此倍率补正。
MoneyMultiplier.label = 金钱 (Gil)
MoneyMultiplier.help = 战斗获得的 Gil。自动结算类 mod 结算的遇敌也会按此倍率补正。
MRPointMultiplier.label = MR 点
MRPointMultiplier.help = 装备的幻影（Vision）获得的熟练度点数。
APMultiplier.label = AP
APMultiplier.help = 战斗获得的 AP。
DropMultiplier.label = 物品掉落
DropMultiplier.help = 掉落概率 × 倍率，最高 100%。
RareAlwaysDrop.label = 稀有物品必掉
RareAlwaysDrop.help = 带稀有掉落的敌人一定会掉落稀有物品。

header.Battle = 战斗
BattleSpeedMultiplier.label = 战斗速度
BattleSpeedMultiplier.help = 叠加游戏自带的 1 / 1.5 / 2 倍速按钮。
AlwaysEscape.label = 逃跑必定成功
AlwaysEscape.help = 只对允许逃跑的战斗生效；Boss 战、剧情战不受影响。
LBGainMultiplier.label = LB 充能
LBGainMultiplier.help = 极限爆发（LB）槽的充能速度。
PersistentLB.label = LB 槽跨战斗保留
PersistentLB.help = 每个角色的 LB 槽会保留到下一场战斗。
LibraScanAll.label = Libra 扫描全体敌人
LibraScanAll.help = Libra、Mechamog Scan（以及使用它们的道具）一次扫描所有敌人，图鉴和弱点照常记录。只改内存里的技能表。
AutoLibra.label = 自动 Libra
AutoLibra.help = 战斗开始时自动扫描所有敌人，包括弱点，第一次遇到的敌人也一样。和真正的 Libra 一样会记入图鉴，存档后即使关掉也会保留。

header.Repeat last command = 重复上次指令
AutoRepeat.label = 自动重复
AutoRepeat.help = 简易自动战斗：每个角色沿用上次的指令，没有记录的角色需手动选择。快捷键：F8。
SmartSupport.label = 辅助技能智能选目标
SmartSupport.help = 重复指令时，回复给 HP 最低的队友，增益给还没有该效果的队友。

header.Items and abilities = 物品与能力
ItemLimit.label = 持有上限
ItemLimit.help = 每种物品最多持有数量。原版为 99；设回 99 即恢复。
APCapacityBonus.label = 能力 AP 上限 +
APCapacityBonus.help = 提高所有角色装备能力的 AP 上限。读取存档后显示。
AbilitySlots.label = 能力栏格数
AbilitySlots.help = 每个角色的能力栏格数（原版 8）。读取存档后生效。格子多了需要更多 AP，可以配合 AP 上限加成。调低时，已经装在多出格子里的能力会保留。

header.Settings window = 设置窗口
Open the settings window.label = 打开设置窗口
Open the settings window.button = 打开
Open the settings window.help = 完整的设置窗口（仅 Windows）：键盘和手柄快捷键、倍率循环档位、添加物品。
AutoOpenSettings.label = 启动游戏时打开设置窗口
AutoOpenSettings.help = 每次启动游戏时自动打开设置窗口。
UILanguage.label = 窗口语言
UILanguage.help = 设置窗口和 FFRS QoL 游戏内提示的语言。
UILanguage.choice.auto = 自动
UILanguage.choice.zh = 中文
UILanguage.choice.en = English

windowOpened = 设置窗口已打开（用 Alt+Tab 切过去）
