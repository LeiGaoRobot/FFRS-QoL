; FFRS Ability Slots settings. Saved changes are picked up within 3 seconds;
; load a save (or go back to the title screen and Continue) to see new slots and AP.

; Ability slots per character: 8 (the game's own number) to 16.
Slots=12

; Extra AP for equipped abilities, added to every character's limit. 0 = none.
APBonus=0

; Shrink the rows of the equipment screen so every slot stays on screen (true/false).
FitPanel=true
