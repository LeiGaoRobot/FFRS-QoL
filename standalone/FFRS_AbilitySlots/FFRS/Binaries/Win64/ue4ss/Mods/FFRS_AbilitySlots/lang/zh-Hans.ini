; FFRS Ability Slots (MogHub page): zh-Hans

plugin.name = FFRS 能力栏扩展
plugin.description = 每个角色 8 – 16 格能力栏，装备画面自动缩小行高放得下。格数和 AP 的修改在读取存档后生效。

AbilitySlots.label = 能力栏格数
AbilitySlots.help = 每个角色的能力栏格数（原版 8）。读取存档后生效。格子多了需要更多 AP，可以配合 AP 上限加成。调低时，已经装在多出格子里的能力会保留。
APCapacityBonus.label = 能力 AP 上限 +
APCapacityBonus.help = 提高所有角色装备能力的 AP 上限。读取存档后显示。
FitEquipmentScreen.label = 装备画面自动适配
FitEquipmentScreen.help = 缩小装备画面的行高，让所有格子都显示在面板里。
