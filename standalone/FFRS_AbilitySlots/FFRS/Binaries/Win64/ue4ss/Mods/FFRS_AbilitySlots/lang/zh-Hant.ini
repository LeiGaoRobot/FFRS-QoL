; FFRS Ability Slots (MogHub page): zh-Hant

plugin.name = FFRS 能力欄擴展
plugin.description = 每個角色 8 – 16 格能力欄，裝備畫面自動縮小行高放得下。格數和 AP 的修改在讀取存檔後生效。

AbilitySlots.label = 能力欄格數
AbilitySlots.help = 每個角色的能力欄格數（原版 8）。讀取存檔後生效。格子多了需要更多 AP，可以配合 AP 上限加成。調低時，已經裝在多出格子裡的能力會保留。
APCapacityBonus.label = 能力 AP 上限 +
APCapacityBonus.help = 提高所有角色裝備能力的 AP 上限。讀取存檔後顯示。
FitEquipmentScreen.label = 裝備畫面自動適配
FitEquipmentScreen.help = 縮小裝備畫面的行高，讓所有格子都顯示在面板裡。
